# Auto-deploy: master'ga push qilinganda serverda avtomatik yangilanadi.
#
# ─── BIR MARTALIK SOZLASH (serverda) ──────────────────────────────────────
# 1. Reponi serverga bir marta klon qiling va PROD .env fayllarini joylang:
#      git clone https://github.com/AmirjonKarimov2007/UzumDashboard.git
#      # services/auth/.env va (kerak bo'lsa) web/.env ni to'ldiring
# 2. Node 20+ va PM2 o'rnating:  npm i -g pm2
# 3. Self-hosted runner o'rnating:
#      GitHub → repo → Settings → Actions → Runners → New self-hosted runner
#      ko'rsatmalarni bajaring, so'ng runnerni xizmat (service) sifatida ishga tushiring:
#        ./svc.sh install && ./svc.sh start     (Linux)
#        # Windows: run.cmd yoki "Install service" varianti
# 4. Repo Variables (Settings → Secrets and variables → Actions → Variables):
#      DEPLOY_DIR            = serverdagi klon yo'li (mas: /home/user/UzumDashboard)
#      NEXT_PUBLIC_API_URL   = public API manzili (mas: https://api.sizningdomen.uz)
#
# Shundan keyin har push avtomatik: fast-forward → build → migrate → target PM2 reload.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Bir vaqtning o'zida faqat bitta deploy ishlasin (ustma-ust tushmasin).
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Pull, build, migrate, restart
        shell: bash
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          DIR="${DEPLOY_DIR:-$HOME/UzumDashboard}"
          echo "▶ Deploy: $DIR"
          cd "$DIR"

          # Serverdagi qo'lda kiritilgan o'zgarish yo'qolmasin: avval recoverable
          # stash yaratiladi, so'ng faqat fast-forward yangilanishga ruxsat beriladi.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git stash push --include-untracked -m "actions-before-deploy-$(date +%Y%m%d%H%M%S)"
          fi
          git fetch origin master --prune
          git checkout master
          git merge --ff-only origin/master

          # Buildlar ketma-ket va past CPU prioritetida ishlaydi.
          ( cd services/auth \
              && nice -n 10 npm ci --prefer-offline --no-audit --no-fund \
              && nice -n 10 npx prisma generate \
              && nice -n 10 npm run build )

          # Frontend (NEXT_PUBLIC_* build paytida inline bo'ladi)
          ( cd web \
              && nice -n 10 npm ci --prefer-offline --no-audit --no-fund \
              && nice -n 10 npm run build )

          # Buildlar o'tgandan keyingina migratsiya va faqat Uzum jarayonlari reload qilinadi.
          ( cd services/auth && npx prisma migrate deploy )
          pm2 reload uzum-auth --update-env || pm2 start ecosystem.config.js --only uzum-auth
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3003/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3003/health >/dev/null
          pm2 reload uzum-web --update-env || pm2 start ecosystem.config.js --only uzum-web
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3002/products >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3002/products >/dev/null
          pm2 save
          echo "✅ Deploy tugadi"
